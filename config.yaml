# 硅基流动（SiliconFlow）配置。密钥只从环境变量 SILICONFLOW_API_KEY 读取，不要写在这个文件里。
siliconflow:
  base_url: https://api.siliconflow.cn/v1

asr:
  model: Qwen/Qwen3-ASR-1.7B
  # 实时链路的两层截止时间（T03b）：单次尝试 3s；整次调用（含重试与退避）5s。
  # 超过总截止抛 AsrTimeout，调用方直接播兜底话术，不再等。
  attempt_timeout_s: 3
  total_timeout_s: 5
  # T11 挂机后的离线校正（recheck_slots）用更宽松的时限，在追问不在关键路径上。
  recheck_attempt_timeout_s: 20
  recheck_total_timeout_s: 60

owner:
  name: 张先生

llm:
  realtime_model: Qwen/Qwen3-8B
  summary_model: Qwen/Qwen3-32B
  first_token_timeout_s: 2.5
  total_timeout_s: 8
  max_tokens: 150
  first_sentence_min_chars: 8

tts:
  model: FunAudioLLM/CosyVoice2-0.5B
  voice: FunAudioLLM/CosyVoice2-0.5B:alex
  first_chunk_timeout_s: 10
  total_timeout_s: 30

audio:
  sample_rate: 16000

interrupt:
  min_speech_ms: 300
  ack_max_ms: 500
