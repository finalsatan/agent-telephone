# 硅基流动（SiliconFlow）配置。密钥只从环境变量 SILICONFLOW_API_KEY 读取，不要写在这个文件里。
siliconflow:
  base_url: https://api.siliconflow.cn/v1

asr:
  model: Qwen/Qwen3-ASR-1.7B
  # 实时链路的两层截止时间（T03b）：单次尝试 3s；整次调用（含重试与退避）5s。
  # 超过总截止抛 AsrTimeout，调用方直接播兜底话术，不再等。
  attempt_timeout_s: 3
  total_timeout_s: 5
  # T11 挂机后的离线校正（recheck_slots）用另一个 ASR 后端重转写整通录音，
  # 时限也更宽松（不在实时路径上）。
  recheck_model: FunAudioLLM/SenseVoiceSmall
  recheck_attempt_timeout_s: 20
  recheck_total_timeout_s: 60

owner:
  name: 张先生

# T07 对话状态机。同一槽位追问达到 max_asks 次仍拿不到，就标 unconfirmed 并跳过。
# T07b：CONFIRM 里“否定 / 无法判定”连续超过 max_confirm_rounds 轮就收尾（槽位保持未确认）。
dialog:
  max_asks: 2
  max_confirm_rounds: 2

llm:
  realtime_model: Qwen/Qwen3-8B
  summary_model: Qwen/Qwen3-32B
  first_token_timeout_s: 2.5
  total_timeout_s: 8
  max_tokens: 150
  first_sentence_min_chars: 8
  # T12b 三种模式（各跑 3 遍，见 docs/progress.md）：
  # full 必填 92.3%、time 9/9；minimal 必填 100%、time 7/9；slots_only 必填 96.2%、time 5/9。
  # T07c 之后 reply 不会被播放，但 Dialog 要等完整 JSON 才能拿到 slots。
  # 默认用 minimal：准确率最高、0 解析失败，LLM 总耗时 P50 比 full 省约 470ms。
  # slots_only 还能再省约 120ms，但 time 掉到 5/9，需要时可用 --reply-mode slots_only 单独跑。
  reply_mode: minimal

tts:
  # T05 起本地 CosyVoice3 是实时主路径（云端首包 P50 4.4s / P95 8.8s）；
  # 云端的模型与音色保留，T06 及之后的代码按 backend 选择。
  backend: local
  local_url: http://127.0.0.1:50000
  model: FunAudioLLM/CosyVoice2-0.5B
  voice: FunAudioLLM/CosyVoice2-0.5B:alex
  first_chunk_timeout_s: 10
  total_timeout_s: 30
  # T12 对比实验：CONFIRM 轮先播预合成的“好的，跟您确认一下。”，同时现合成后半句。
  # 默认关闭，评估脚本用 --confirm-lead 打开。
  confirm_lead: false
  # T06 预合成话术缓存：cache/tts/<backend>/<sha1(版本+文本+音色)>.pcm（T06b 起含版本与分隔符）。
  phrase_cache:
    dir: cache/tts
    # 号码数字片段首尾静音的裁剪阈值（int16 RMS，约 -44dBFS）；TTS 的“静音”也有底噪。
    trim_threshold: 200
    trim_frame_ms: 10
    # 复述号码的间隔：组间（3-4-4 或区号-号码）150ms、位间 40ms。
    digit_gap_ms: 40
    group_gap_ms: 150

audio:
  sample_rate: 16000

# T09 轮次判断（本地 CPU，模型见 core/turn.py 顶部说明）。
vad:
  threshold: 0.5
  # 连续静音达到该值算一段发声结束（speech_end），并立刻跑一次 Smart Turn。
  # T13c：200ms 时场景 wav 的误切率 70–80%（逗号处停顿就被判说完），见 docs/progress.md
  # 的参数扫描表。600ms + 阈值 0.85 是扫描网格里唯一把误切率压到 10% 以内的组合
  # （信道关 6.8% / 开 9.1%），代价是结束延迟 P50 比 200ms 多约 380ms（超出任务书
  # 300ms 的上限约 80ms）——这是待用户决定的取舍，不满意可改回 200 / 0.5。
  speech_end_silence_ms: 600
  # T13c：Smart Turn 概率达到该值才算说完（模型自带的布尔结果固定按 0.5 判）。
  smart_turn_threshold: 0.85
  # Smart Turn 判为没说完时，静音超过该值就强制结束本轮（turn_end 兜底）。
  # T14b（第 23 次评审）：从 3.0 改为 2.0。场景集里有 7–8/44 句说完了 Smart Turn
  # 却给出低概率（如 0.03–0.36），要等满 stop_secs 兜底；实测 2.0 / 1.5 的误切率
  # 不变（关 3/44、开 4/44），结束延迟 P95 从 3.1s 降到 2.1s / 1.6s。
  # 代价：长时间思考停顿可能被提前截断，场景集只有 s09 一条这类场景，真人录音到位后重测。
  stop_secs: 2.0
  # 送 Smart Turn 的音频与离线切轮时保留的预卷长度。
  pre_speech_ms: 500
  # 单轮送 Smart Turn 的最长音频（模型只取最后 8s）。
  max_segment_s: 8.0

interrupt:
  min_speech_ms: 300
  ack_max_ms: 500

# T12 场景集：来电者语音用云端 TTS 的另一个音色合成（必须与 AI 的音色不同）。
scenarios:
  caller_voice: FunAudioLLM/CosyVoice2-0.5B:anna
  default_gap_ms: 800

# T13 测试页面后端（web/server.py）。
# 启动：uv run python -m web.server，然后浏览器打开 http://127.0.0.1:8000
web:
  host: 127.0.0.1
  port: 8000
  # 信道模拟开关的默认值；页面参数面板可改，只对下一通生效。
  # 跑真实麦克风测试时保持开启（听感更接近电话线路）。
  channel_sim: true
  # 历史通话与实时通话的输出目录（每通一个子目录）。
  calls_dir: calls
