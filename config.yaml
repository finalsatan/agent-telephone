# 硅基流动（SiliconFlow）配置。密钥只从环境变量 SILICONFLOW_API_KEY 读取，不要写在这个文件里。
siliconflow:
  base_url: https://api.siliconflow.cn/v1

asr:
  model: Qwen/Qwen3-ASR-1.7B

owner:
  name: 张先生

llm:
  realtime_model: Qwen/Qwen3-8B
  summary_model: Qwen/Qwen3-32B
  first_token_timeout_s: 2.5
  total_timeout_s: 8
  max_tokens: 150
  first_sentence_min_chars: 8

tts:
  # T05 起本地 CosyVoice3 是实时主路径（云端首包 P50 4.4s / P95 8.8s）；
  # 云端的模型与音色保留，T06 及之后的代码按 backend 选择。
  backend: local
  local_url: http://127.0.0.1:50000
  model: FunAudioLLM/CosyVoice2-0.5B
  voice: FunAudioLLM/CosyVoice2-0.5B:alex
  first_chunk_timeout_s: 10
  total_timeout_s: 30

audio:
  sample_rate: 16000

interrupt:
  min_speech_ms: 300
  ack_max_ms: 500
